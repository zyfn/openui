name: Publish Swift SDK guide
on:
  push:
    branches: [main]
    paths:
      - 'sites/swift-sdk/**'
      - 'packages/swift-ui/**'
      - 'examples/agent-cases/**'
      - '.github/workflows/swift-sdk-guide.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: swift-sdk-guide-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/swift-sdk/package-lock.json
      - run: npm ci --prefix sites/swift-sdk --ignore-scripts
      - run: npm run check:data --prefix sites/swift-sdk
      - run: npm run build --prefix sites/swift-sdk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/swift-sdk/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
