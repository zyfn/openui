name: Build Swift

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'packages/swift-lang/**'
      - 'packages/swift-ui/**'
      - 'packages/lang-core/**'
      - 'examples/app-frameworks/swiftui-macos/**'
      - 'examples/agent-cases/**'
      - 'spec/**'
      - '.github/workflows/build-swift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'packages/swift-lang/**'
      - 'packages/swift-ui/**'
      - 'packages/lang-core/**'
      - 'examples/app-frameworks/swiftui-macos/**'
      - 'examples/agent-cases/**'
      - 'spec/**'
      - '.github/workflows/build-swift.yml'

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked SDK inputs only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openui-sdk-source"
          git rev-parse HEAD > "$RUNNER_TEMP/openui-sdk-source/checkout-sha.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/openui-sdk-source/git-tree.txt"
          git archive --format=tar HEAD Package.swift packages/swift-ui packages/swift-lang packages/lang-core spec examples/agent-cases examples/app-frameworks/swiftui-macos .github/workflows/build-swift.yml > "$RUNNER_TEMP/openui-sdk-source/sdk-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openui-sdk-source/
          retention-days: 7
  test:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          {
            printf 'repository=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\nworkflow_sha=%s\npr_head=%s\npr_base=%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" \
              "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA"
            printf 'checkout_sha='
            git rev-parse HEAD
            swift --version
            xcodebuild -version
          } 2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/provenance.log"
      - name: Verify bundled shared core
        run: |
          npm ci --prefix packages/swift-lang/scripts --ignore-scripts
          node packages/swift-lang/scripts/build.mjs
          git diff --exit-code -- packages/swift-lang/Sources/OpenUILang/Resources
      - name: SDK tests through the distribution manifest
        env:
          OPENUI_SNAPSHOT_DIR: ${{ runner.temp }}/openui-swift-logs/visual
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift test 2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/sdk-tests.log"
      - name: Release native host fitting probe
        env:
          OPENUI_SNAPSHOT_DIR: ${{ runner.temp }}/openui-swift-logs/visual
        shell: bash
        run: |
          set -o pipefail
          swift test -c release --filter HostSizingIsolationTests \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/native-release.log"
      - name: Authoring validator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          node --test packages/swift-lang/validation/validation.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/authoring.log"
      - name: Language runtime memory checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift test --package-path packages/swift-lang \
            --scratch-path "$RUNNER_TEMP/openui-asan" --sanitize=address \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/asan.log"
      - name: Compile the standalone macOS example
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift build --package-path examples/app-frameworks/swiftui-macos \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/macos-build.log"
      - name: iOS Simulator compile through the distribution manifest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift build --scratch-path "$RUNNER_TEMP/openui-ios" \
            --triple arm64-apple-ios16.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/ios-build.log"
      - name: Preserve Swift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openui-swift-logs/
          if-no-files-found: ignore
          retention-days: 7
