name: Build Swift

on:
  push:
    branches: [main]
    paths:
      - 'packages/swift-lang/**'
      - 'packages/swift-ui/**'
      - 'packages/lang-core/**'
      - 'examples/app-frameworks/swiftui-macos/**'
      - 'spec/**'
      - '.github/workflows/build-swift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/swift-lang/**'
      - 'packages/swift-ui/**'
      - 'packages/lang-core/**'
      - 'examples/app-frameworks/swiftui-macos/**'
      - 'spec/**'
      - '.github/workflows/build-swift.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Verify bundled shared core
        run: |
          npm ci --prefix packages/swift-lang/scripts --ignore-scripts
          node packages/swift-lang/scripts/build.mjs
          git diff --exit-code -- packages/swift-lang/Sources/OpenUILang/Resources
      - name: Language protocol and TypeScript reference cases
        run: swift test --package-path packages/swift-lang
      - name: Authoring validator
        run: node --test packages/swift-lang/validation/validation.test.mjs
      - name: Language runtime memory checks
        run: >-
          swift test --package-path packages/swift-lang
          --scratch-path "$RUNNER_TEMP/openui-asan" --sanitize=address
      - name: SwiftUI adapter and upstream interaction cases
        run: swift test --package-path packages/swift-ui
      - name: Compile the standalone macOS example
        run: swift build --package-path examples/app-frameworks/swiftui-macos
      - name: Compile for iOS 15 Simulator
        run: >-
          swift build --package-path packages/swift-ui
          --scratch-path "$RUNNER_TEMP/openui-ios"
          --triple arm64-apple-ios15.0-simulator
          --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
