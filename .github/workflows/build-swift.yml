name: Build Swift

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'packages/swift-lang/**'
      - 'packages/swift-ui/**'
      - 'packages/lang-core/**'
      - 'examples/app-frameworks/swiftui-macos/**'
      - 'examples/agent-cases/**'
      - 'spec/**'
      - '.github/workflows/build-swift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'packages/swift-lang/**'
      - 'packages/swift-ui/**'
      - 'packages/lang-core/**'
      - 'examples/app-frameworks/swiftui-macos/**'
      - 'examples/agent-cases/**'
      - 'spec/**'
      - '.github/workflows/build-swift.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Verify bundled shared core
        run: |
          npm ci --prefix packages/swift-lang/scripts --ignore-scripts
          node packages/swift-lang/scripts/build.mjs
          git diff --exit-code -- packages/swift-lang/Sources/OpenUILang/Resources
      - name: SDK tests through the distribution manifest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift test 2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/sdk-tests.log"
      - name: Authoring validator
        run: node --test packages/swift-lang/validation/validation.test.mjs
      - name: Language runtime memory checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift test --package-path packages/swift-lang \
            --scratch-path "$RUNNER_TEMP/openui-asan" --sanitize=address \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/asan.log"
      - name: Compile the standalone macOS example
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift build --package-path examples/app-frameworks/swiftui-macos \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/macos-build.log"
      - name: iOS Simulator compile through the distribution manifest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/openui-swift-logs"
          swift build --scratch-path "$RUNNER_TEMP/openui-ios" \
            --triple arm64-apple-ios16.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            2>&1 | tee "$RUNNER_TEMP/openui-swift-logs/ios-build.log"
      - name: Preserve Swift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openui-swift-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
